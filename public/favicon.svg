<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#140D26" />
      <stop offset="70%" stop-color="#070C1C" />
      <stop offset="100%" stop-color="#03050C" />
    </radialGradient>

    <!-- Outer Fire Glow -->
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Fiery Gradients -->
    <linearGradient id="deepFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="40%" stop-color="#DC2626" />
      <stop offset="80%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="innerFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <linearGradient id="coreLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Gold Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Shield -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="12" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Radiance Rays -->
  <g opacity="0.25" stroke="#FBBF24" stroke-width="3">
    <line x1="256" y1="20" x2="256" y2="70" />
    <line x1="256" y1="442" x2="256" y2="492" />
    <line x1="20" y1="256" x2="70" y2="256" />
    <line x1="442" y1="256" x2="492" y2="256" />
    <line x1="89" y1="89" x2="125" y2="125" />
    <line x1="387" y1="387" x2="423" y2="423" />
    <line x1="89" y1="423" x2="125" y2="387" />
    <line x1="387" y1="125" x2="423" y2="89" />
  </g>

  <!-- Master Flame Shape -->
  <g filter="url(#flameGlow)">
    <!-- Outer Large Tongue -->
    <path d="M 256,60 C 290,140 370,180 370,290 C 370,365 315,420 256,420 C 197,420 142,365 142,290 C 142,210 200,165 220,135 C 230,170 260,195 275,170 C 295,135 270,95 256,60 Z"
          fill="url(#deepFlame)" />

    <!-- Left Sub-Tongue -->
    <path d="M 256,410 C 200,410 160,355 160,300 C 160,240 210,210 215,160 C 180,200 175,250 175,280 C 175,340 210,380 256,410 Z"
          fill="#B91C1C" opacity="0.7" />

    <!-- Mid Flame Core -->
    <path d="M 256,130 C 285,185 335,230 335,310 C 335,365 295,395 256,395 C 217,395 177,365 177,310 C 177,245 225,200 238,175 C 248,200 268,205 270,180 C 275,155 262,145 256,130 Z"
          fill="url(#innerFlame)" />

    <!-- Brightest Inner Pure Flame -->
    <path d="M 256,220 C 275,260 295,290 295,335 C 295,370 275,385 256,385 C 237,385 217,370 217,335 C 217,295 240,265 250,245 C 253,258 260,260 262,245 C 265,230 258,225 256,220 Z"
          fill="url(#coreLight)" />
  </g>

  <!-- Cross Silhouette in Center of Flame -->
  <g fill="#FFFFFF" opacity="0.95">
    <rect x="250" y="270" width="12" height="75" rx="4" />
    <rect x="235" y="290" width="42" height="12" rx="4" />
  </g>

  <!-- Bold Curved Text Banner -->
  <path id="textCurveTop" d="M 90,256 A 166,166 0 0,1 422,256" fill="none" />
  <path id="textCurveBottom" d="M 422,256 A 166,166 0 0,1 90,256" fill="none" />

  <!-- "YOUNG FIRE" Wordmark Emblem -->
  <text fill="#FFFFFF" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="34" letter-spacing="4">
    <textPath href="#textCurveBottom" startOffset="50%" text-anchor="middle">
      YOUNG FIRE
    </textPath>
  </text>
  <text fill="#FBBF24" font-family="'Cinzel', Georgia, serif" font-weight="700" font-size="18" letter-spacing="6" opacity="0.9">
    <textPath href="#textCurveTop" startOffset="50%" text-anchor="middle">
      JOSHUA HOUSE
    </textPath>
  </text>
</svg>
